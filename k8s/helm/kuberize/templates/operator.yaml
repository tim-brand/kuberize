apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberize-operator
  namespace: kuberize-system
  labels:
    {{- include "kuberize.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberize
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberize
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: kuberize-operator
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            - name: HEALTH_PORT
              value: "8080"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
