apiVersion: v1
kind: Secret
metadata:
  name: kuberize-api-secrets
  namespace: kuberize-system
  labels:
    {{- include "kuberize.labels" . | nindent 4 }}
  annotations:
    # "keep" only guards uninstall. Upgrade stability comes from the lookup in
    # the kuberize.apiKey / kuberize.githubWebhookSecret helpers, which reuse
    # the existing Secret's values instead of re-randomizing on every render.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  API_KEY: {{ include "kuberize.apiKey" . | quote }}
  GITHUB_WEBHOOK_SECRET: {{ include "kuberize.githubWebhookSecret" . | quote }}
