apiVersion: v1
kind: Secret
metadata:
  name: kuberize-api-secrets
  namespace: kuberize-system
  labels:
    {{- include "kuberize.labels" . | nindent 4 }}
  annotations:
    # Do not overwrite existing secret on upgrade — keeps previously-generated keys stable
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  API_KEY: {{ include "kuberize.apiKey" . | quote }}
  GITHUB_WEBHOOK_SECRET: {{ include "kuberize.githubWebhookSecret" . | quote }}
