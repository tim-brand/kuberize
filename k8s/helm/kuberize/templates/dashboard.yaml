apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberize-dashboard
  namespace: kuberize-system
  labels:
    {{- include "kuberize.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberize
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberize
        app.kubernetes.io/component: dashboard
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          env:
            - name: PORT
              value: "3000"
            - name: KUBERIZE_API_URL
              value: http://kuberize-api.kuberize-system.svc.cluster.local:3001
            - name: KUBERIZE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kuberize-api-secrets
                  key: API_KEY
          ports:
            - name: http
              containerPort: 3000
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kuberize-dashboard
  namespace: kuberize-system
  labels:
    {{- include "kuberize.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kuberize
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 3000
      targetPort: http
