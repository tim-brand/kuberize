apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberize-api
  namespace: kuberize-system
  labels:
    {{- include "kuberize.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberize
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberize
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: kuberize-api
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          env:
            - name: PORT
              value: "3001"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: kuberize-api-secrets
                  key: API_KEY
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: kuberize-api-secrets
                  key: GITHUB_WEBHOOK_SECRET
            {{- if or .Values.api.publicUrl (and .Values.ingress.enabled .Values.global.baseDomain) }}
            - name: KUBERIZE_API_PUBLIC_URL
              value: {{ .Values.api.publicUrl | default (printf "https://kuberize-api.%s" .Values.global.baseDomain) | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3001
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kuberize-api
  namespace: kuberize-system
  labels:
    {{- include "kuberize.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kuberize
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3001
      targetPort: http
