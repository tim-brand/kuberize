apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kuberizeservices.kuberize.io
spec:
  group: kuberize.io
  names:
    kind: KuberizeService
    listKind: KuberizeServiceList
    plural: kuberizeservices
    singular: kuberizeservice
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [projectRef, serviceName, type, plan, scope]
              properties:
                projectRef:
                  type: string
                serviceName:
                  type: string
                type:
                  type: string
                  enum: [postgresql, redis, rabbitmq, minio]
                version:
                  type: string
                plan:
                  type: string
                  enum: [small, medium, large]
                scope:
                  type: string
                  enum: [project, app]
                appName:
                  type: string
                environment:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                  enum: [Pending, Provisioning, Ready, Error]
                connectionSecretRef:
                  type: string
                namespace:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
